name: Build 7-in-1 Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download release assets using GitHub token
        env:
          PRIVATE_GH_TOKEN: ${{ secrets.PRIVATE_GH_TOKEN }}
        run: |
          python scripts/download_release_assets.py --config apps.json --token "$env:PRIVATE_GH_TOKEN"

      - name: Build launcher EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "7_in_1_launcher" --add-data "apps.json;." --add-data "dist_assets;dist_assets" launcher_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7_in_1_launcher.exe
          path: dist\7_in_1_launcher.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('7-in-1 Launcher v{0}', github.run_number) || format('7-in-1 Launcher {0}', github.ref_name) }}
          files: dist/7_in_1_launcher.exe
          draft: false
          generate_release_notes: true
